name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CertPilot.sln --locked-mode
      - run: dotnet build CertPilot.sln -c Release --no-restore
      - run: dotnet test tests/CertPilot.Tests/CertPilot.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults
      - name: Publish complete Windows package
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Verify native WPF and installed service
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -PackageDirectory ./artifacts/CertPilot-win-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: |
            artifacts/smoke-evidence
            TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: CertPilot-win-x64
          path: artifacts/CertPilot-win-x64
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: git diff --exit-code -- src/CertPilot.Service/wwwroot
