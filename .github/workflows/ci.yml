name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore CertPilot.sln --locked-mode
      - run: dotnet build CertPilot.sln --configuration ${{ matrix.configuration }} --no-restore
      - run: dotnet test CertPilot.sln --configuration ${{ matrix.configuration }} --no-build --logger trx --results-directory TestResults
      - run: dotnet publish src/CertPilot.Service/CertPilot.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/CertPilot-win-x64
      - uses: actions/upload-artifact@v4
        with: { name: CertPilot-win-x64, path: artifacts/CertPilot-win-x64 }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: git diff --exit-code -- src/CertPilot.Service/wwwroot
