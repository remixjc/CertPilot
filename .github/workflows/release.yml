name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        run: npm ci --prefix web && npm run build --prefix web
      - run: dotnet restore CertPilot.sln --locked-mode
      - run: dotnet test tests/CertPilot.Tests/CertPilot.Tests.csproj -c Release --no-restore
      - name: Publish desktop and service
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Version '${{ github.ref_name }}'
      - name: Verify installed package
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -PackageDirectory ./artifacts/CertPilot-win-x64
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: artifacts/smoke-evidence
      - name: Archive complete package
        shell: pwsh
        run: |
          $archive = 'artifacts/CertPilot-${{ github.ref_name }}-win-x64.zip'
          Compress-Archive -Path artifacts/CertPilot-win-x64/* -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + (Split-Path $archive -Leaf) | Set-Content "$archive.sha256" -Encoding ASCII
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/CertPilot-${{ github.ref_name }}-win-x64.zip
            artifacts/CertPilot-${{ github.ref_name }}-win-x64.zip.sha256
