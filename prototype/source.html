<script>
(() => {
  const root = document.getElementById('certpilot');
  const main = root.querySelector('.cp-main');
  const today = new Date('2026-11-16T00:00:00Z');
  const initial = [
    {id:'c1',name:'官方网站',domains:['example.com','www.example.com'],email:'ops@example.com',path:'D:\\Certificates\\website',base:'website',format:'both',method:'dns',credential:'cred1',webroot:'',auto:true,status:'valid',expires:'2027-01-17',next:'2026-12-18',algorithm:'rsa'},
    {id:'c2',name:'业务泛域名',domains:['example.net','*.example.net'],email:'admin@example.net',path:'D:\\Certificates\\business',base:'business',format:'pfx',method:'dns',credential:'cred2',webroot:'',auto:true,status:'due',expires:'2026-12-01',next:'2026-11-16',algorithm:'rsa'},
    {id:'c3',name:'内部网关',domains:['gateway.example.org'],email:'it@example.org',path:'D:\\Certificates\\gateway',base:'gateway',format:'pem',method:'dns',credential:'cred3',webroot:'',auto:true,status:'failed',expires:'2026-11-25',next:'等待修复 DNS 凭据',algorithm:'rsa'}
  ];
  let certs = initial.map(x => ({...x}));
  let credentials = [
    {id:'cred1',name:'Cloudflare · 主账号',provider:'Cloudflare',valid:true},
    {id:'cred2',name:'阿里云 DNS · 业务账号',provider:'阿里云 DNS',valid:true},
    {id:'cred3',name:'腾讯云 DNSPod · 网关账号',provider:'腾讯云 DNSPod',valid:false}
  ];
  let logs = [
    {name:'内部网关',message:'续期失败：DNS API 凭据已失效，旧证书保留。修复后可重试。',time:'2026-11-16 09:42',bad:true},
    {name:'业务泛域名',message:'已进入续期窗口，等待后台任务执行。',time:'2026-11-16 09:30'},
    {name:'官方网站',message:'证书有效，尚未进入续期窗口。',time:'2026-11-16 09:30'}
  ];
  let page = 'certs', selected = null, jobs = new Map(), toastTimer;
  let web = {mode:'local',port:'8443',ip:'192.168.1.10',hostname:'certpilot.example.com',trusted:false};
  let apiResult=null, inspection=null, inspecting=false, inspectTarget='';
  const webOrigin=()=>web.mode==='local'?`https://localhost:${web.port}`:`https://${web.hostname}:${web.port}`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const days = c => Math.max(0,Math.ceil((new Date(c.expires+'T00:00:00Z')-today)/86400000));
  const formatLabel = c => c.format==='both'?'PEM + PFX':c.format.toUpperCase();
  const status = c => jobs.has(c.id)?'<span class="cp-status cp-pill cp-warn">● 正在签发</span>':c.status==='failed'?'<span class="cp-status cp-pill cp-bad">● 续期失败</span>':c.status==='new'?'<span class="cp-status cp-pill cp-warn">○ 待签发</span>':c.status==='due'?'<span class="cp-status cp-pill cp-warn">◷ 待续期</span>':'<span class="cp-status cp-pill cp-ok">● 有效</span>';
  const files = c => {
    const stem = c.path.replace(/[\\\/]+$/,'')+'\\'+c.base;
    return [...(c.format!=='pfx'?[stem+'.crt',stem+'.fullchain.pem',stem+'.key']:[]),...(c.format!=='pem'?[stem+'.pfx']:[])];
  };
  function icons() { if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:17,height:17}}); }
  function toast(message) { const t=root.querySelector('.cp-toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3600); }
  function remember() {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({
      modelContent:{screen:page,certificateCount:certs.length,prototype:true},
      privateContent:{certs,credentials,logs:logs.slice(0,15),page,selected,web}
    }).catch(()=>{});
  }
  function restore(state) {
    const s=state?.privateContent;
    if(!s || !Array.isArray(s.certs) || !Array.isArray(s.credentials) || !Array.isArray(s.logs)) return;
    certs=s.certs;credentials=s.credentials;logs=s.logs;
    selected=typeof s.selected==='string'?s.selected:null;
    if(s.web && ['local','intranet'].includes(s.web.mode))web={...web,...s.web};
    page=['certs','credentials','settings','activity','detail','webapi','webmonitor'].includes(s.page)?s.page:'certs';
    if(page==='detail' && !certs.some(c=>c.id===selected))page='certs';
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{
    if(event.detail?.globals?.widgetState && jobs.size===0) {restore(event.detail.globals.widgetState);render();}
  });
  function head(title,subtitle,action='') {return `<div class="cp-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;}
  function render() {
    root.querySelectorAll('.cp-nav').forEach(n=>{const active=n.dataset.page===page || (page==='webmonitor' && n.dataset.page==='webapi');n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});
    root.querySelector('.cp-count').textContent=certs.length;
    if(page==='certs') list();
    else if(page==='activity') activity();
    else if(page==='credentials') credentialPage();
    else if(page==='settings') settings();
    else if(page==='detail') detail();
    else if(page==='webapi') webApi();
    else if(page==='webmonitor') webMonitor();
    icons();
  }
  function list() {
    const valid=certs.filter(c=>c.status!=='new' && days(c)>0).length;
    const attention=certs.filter(c=>['due','failed','new'].includes(c.status)).length;
    main.innerHTML=head('证书管理','集中管理域名证书，让续期在后台自动完成。',`<button class="cp-button cp-primary" data-action="new">${icon('plus')}新建证书</button>`)+

      const ip=v.ip.split('.').map(Number);
      const privateIp=ip.length===4 && ip.every(n=>Number.isInteger(n)&&n>=0&&n<=255) && (ip[0]===10 || (ip[0]===172 && ip[1]>=16 && ip[1]<=31) || (ip[0]===192 && ip[1]===168));
      if(!error && v.mode==='intranet' && !privateIp)error='演示中请填写有效的 IPv4 内网地址。正式版还需核实该地址属于本机网卡。';
      if(!error && v.mode==='intranet' && !/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i.test(v.hostname))error='请填写管理证书对应的访问域名，不包含协议、端口或路径。';
      if(!error && v.mode==='intranet' && !v.trusted)error='启用内网访问前，需要配置客户端信任且与访问域名匹配的管理证书。';
      if(error){const el=main.querySelector('.cp-weberror');el.textContent=error;el.hidden=false;return;}
      web=v;remember();toast('访问配置已模拟保存，未更改真实监听或防火墙');render();
    });
  }
  function apiOutput() {
    return `<span class="cp-status cp-pill ${apiResult.status===200?'cp-ok':'cp-bad'}">HTTP ${apiResult.status} · 模拟响应</span><pre class="cp-preview cp-json">${esc(JSON.stringify(apiResult.body,null,2))}</pre>`;
  }
  function apiQuery() {
    const path=main.querySelector('.cp-apiendpoint').value;
    const authenticated=main.querySelector('.cp-apiidentity').value==='read';
    apiResult=!authenticated?{status:401,body:{title:'需要身份认证',status:401,code:'UNAUTHENTICATED',traceId:'demo-request'}}:
      path==='certificates'?{status:200,body:{items:certs.map(c=>({
        id:c.id,name:c.name,domains:c.domains,autoRenew:c.auto,
        certificate:{status:c.status==='new'?'notIssued':'valid',notAfterUtc:c.expires?c.expires+'T00:00:00Z':null,domains:c.domains},
        renewal:{status:c.auto?(c.status==='failed'?'failed':'scheduled'):'paused',nextAttemptAtUtc:/^\d{4}-\d{2}-\d{2}$/.test(c.next)?c.next+'T00:00:00Z':null}
      })),nextCursor:null}}:{status:200,body:{service:'CertPilot.Service',worker:{status:'running'},web:{status:'running',origin:webOrigin()},mode:'prototype'}};
    main.querySelector('.cp-apioutput').innerHTML=apiOutput();
  }
  function webMonitor() {
    main.innerHTML=`<button class="cp-back" data-page="webapi">${icon('arrow-left')}Web 与 API</button>`+
      head('浏览器监控','浏览器、桌面端与 API 共用同一批证书和任务。')+
      `<div class="cp-access"><span class="cp-status cp-pill cp-ok">● Web 已连接（模拟）</span><span class="cp-muted">演示账号：Operator · ${esc(webOrigin())}</span></div>
      <section class="cp-tablebox"><div class="cp-tabletop"><strong>托管证书</strong><span class="cp-muted">${certs.length} 张</span></div><table class="cp-table"><thead><tr><th style="width:42%">名称 / 域名</th><th>状态</th><th>有效期至</th></tr></thead><tbody>${certs.map(c=>`<tr><td><strong>${esc(c.name)}</strong><span>${esc(c.domains[0])}</span></td><td>${status(c)}</td><td>${c.expires||'尚未签发'}</td></tr>`).join('')}</tbody></table></section>
      <section class="cp-panel" style="margin-top:18px"><h3>站点证书检测</h3><label class="cp-field">检测目标<select class="cp-inspecttarget" ${inspecting?'disabled':''}>${certs.flatMap(c=>c.domains.filter(d=>!d.startsWith('*.')).map(d=>`<option value="${esc(c.id+'|'+d)}" ${inspectTarget===c.id+'|'+d?'selected':''}>${esc(c.name+' · '+d+':443')}</option>`)).join('')}</select><small>仅检查已托管的具体域名；由服务器发起 TLS 连接，区别于本地证书文件状态。</small></label>
      <div class="cp-actions"><button class="cp-button cp-primary" data-action="inspect" ${inspecting || !certs.some(c=>c.domains.some(d=>!d.startsWith('*.')))?'disabled':''}>${icon('scan-line')}${inspecting?'检测中（模拟）':'运行检测（模拟）'}</button></div>
      <div class="cp-inspectresult" role="status" aria-live="polite">${inspection?`<div class="cp-info">${icon('info')}<span>${esc(inspection.target)} · ${esc(inspection.name)}<br>${inspection.mismatch?'TLS 可连接，但网站仍呈现旧证书，与托管版本指纹不一致。':'TLS 可连接；域名、证书链和托管版本指纹匹配。'}<br>检测位置：服务器 · 示例时间：2026-11-16 · 未发起真实连接</span></div>`:''}</div></section>
      <div class="cp-info">${icon('info')}<span>此处为已登录的浏览器页面预览，未实现真实登录或网络检测。正式版显示观测时间、目标节点与完整错误原因。</span></div>`;
    main.querySelector('.cp-inspecttarget').addEventListener('change',event=>{inspectTarget=event.target.value;inspection=null;main.querySelector('.cp-inspectresult').innerHTML='';});
  }
  async function inspect() {
    if(inspecting)return;
    inspectTarget=main.querySelector('.cp-inspecttarget').value;
    const [id,target]=inspectTarget.split('|');
    if(!id || !target)return;
    inspecting=true;inspection=null;webMonitor();icons();
    await new Promise(resolve=>setTimeout(resolve,700));
    inspection={target,name:certs.find(c=>c.id===id)?.name||'',mismatch:id==='c3'};
    inspecting=false;if(page==='webmonitor'){render();}
  }
  async function issue(id) {
    const c=certs.find(x=>x.id===id);if(!c || jobs.has(id))return;
    const credential=credentials.find(x=>x.id===c.credential);
    if(c.method==='dns' && !credential?.valid) {toast('DNS 凭据失效，请先到“DNS 凭据”修复');return;}
    const stages=['创建 ACME 订单','准备域名验证','等待验证通过','生成并检查证书','更新证书文件'];
    jobs.set(id,{label:stages[0],progress:0});
    selected=id;page='detail';render();
    for(let i=0;i<stages.length;i++){
      jobs.set(id,{label:stages[i],progress:(i+1)*20});
      if(page==='detail' && selected===id){render();}
      await new Promise(resolve=>setTimeout(resolve,450));
    }
    c.status='valid';c.expires='2027-02-14';c.next='2027-01-15';jobs.delete(id);
    logs.unshift({name:c.name,message:'模拟签发成功，已计算下一次续期时间。未连接 CA，也未写入证书文件。',time:'2026-11-16 · 刚刚'});
    render();remember();toast('模拟签发完成，未产生真实证书');
  }
  root.addEventListener('click',e=>{
    const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();remember();return;}
    if(e.target.closest('.cp-openmonitor')){root.querySelector('.cp-shell').hidden=false;root.querySelector('.cp-titlebar').hidden=false;root.querySelector('.cp-closed').hidden=true;page='webmonitor';render();return;}
    if(e.target.closest('.cp-exit')){root.querySelector('.cp-shell').hidden=true;root.querySelector('.cp-titlebar').hidden=true;root.querySelector('.cp-closed').hidden=false;return;}
    if(e.target.closest('.cp-reopen')){root.querySelector('.cp-shell').hidden=false;root.querySelector('.cp-titlebar').hidden=false;root.querySelector('.cp-closed').hidden=true;render();return;}
    const button=e.target.closest('[data-action]');if(!button || button.disabled)return;
    const {action,id}=button.dataset;
    if(action==='new')return editor();
    if(action==='apiquery')return apiQuery();
    if(action==='inspect')return inspect();
    if(action==='edit')return editor(id);
    if(action==='back'){page='certs';render();}
    if(action==='detail'){selected=id;page='detail';render();}
    if(action==='issue')issue(id);
    if(action==='toggle'){const c=certs.find(x=>x.id===id);if(c){c.auto=!c.auto;render();remember();}}
    if(action==='repair'){const c=credentials.find(x=>x.id===id);if(c){c.valid=true;render();remember();toast('模拟凭据已修复，可返回证书详情重试续期');}}
    if(action==='delete'){
      main.innerHTML=head('移除托管配置','此操作停止后续托管；已生成证书文件保留，证书不会被吊销。')+
        `<section class="cp-panel"><h3>${esc(certs.find(c=>c.id===id)?.name)}</h3><p class="cp-muted">确认后可重新新建配置。此处为原型操作。</p><div class="cp-actions"><button class="cp-button" data-action="detail" data-id="${esc(id)}">取消</button><button class="cp-button cp-danger" data-action="confirmdelete" data-id="${esc(id)}">确认移除</button></div></section>`;
    }
    if(action==='confirmdelete'){certs=certs.filter(c=>c.id!==id);page='certs';render();remember();toast('已移除托管配置（模拟）');}
  });
  render();
  if(globalThis.Tweak){
    const design={radius:14,density:'标准'};
    const tweak=new Tweak({container:root,onChange:()=>{
      root.querySelector('.cp-window').style.borderRadius=design.radius+'px';
      main.style.padding=design.density==='紧凑'?'18px':'28px';
    }});
    tweak.addSlider(design,'radius',{label:'窗口圆角',min:0,max:20,step:2,unit:'px'});
    tweak.addSelect(design,'density',{label:'内容密度',options:['标准','紧凑']});
  }
})();
</script>
